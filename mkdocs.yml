site_name: NLP Well Report Analyzer
site_description: Information extraction from unstructured drilling and completion reports.
repo_url: https://github.com/kcabrera83/nlp-well-report-analyzer
site_author: Kelvin J Cabrera

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top

nav:
  - Home: index.md
  - API Reference: api.md
  - Models: models.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
